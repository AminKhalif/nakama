name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s packages/python/gwclient/tests -t packages/python
      - run: python -m unittest discover -s tests/integration -v
      - run: python packages/python/gateway/selftest_crypto.py
      - run: python packages/python/gateway/selftest_e2e.py
      - run: python tests/conformance/test_conformance.py
      - run: python tests/redteam/test_redteam.py
      - run: python -m unittest discover -s examples/ttt-auditor/tests
      - run: python examples/ttt-auditor/run_demo.py
      - run: python -m nakama demo
      - run: python -m nakama meeting-demo
      - run: python -m build --wheel
